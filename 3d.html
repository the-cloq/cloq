<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Untitled Document</title>
<style>
body {margin:0;}	
</style>
<script>
import * as THREE from "https://cdn.skypack.dev/three@0.149.0";
import {
    OrbitControls
} from 'https://cdn.jsdelivr.net/npm/three@0.142.0/examples/jsm/controls/OrbitControls.js';

let camera, controls, scene, renderer;
let mesh;

init();
animate();

function init() {

    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.z = 600;


    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xedede9)

    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(200, 100, 5);
    scene.add(light);

    const geometry = new THREE.BoxGeometry(450, 450, 5);
    const material = [
        new THREE.MeshBasicMaterial({
            map: new THREE.TextureLoader().load('')
        }),
        new THREE.MeshBasicMaterial({
            map: new THREE.TextureLoader().load('')
        }),
        new THREE.MeshBasicMaterial({
            map: new THREE.TextureLoader().load('')
        }),
        new THREE.MeshBasicMaterial({
            map: new THREE.TextureLoader().load('')
        }),
        new THREE.MeshBasicMaterial({
            map: new THREE.TextureLoader().load('https://s3.amazonaws.com/duhaime/blog/tsne-webgl/assets/cat.jpg')
        }),
        new THREE.MeshBasicMaterial({
            map: new THREE.TextureLoader().load('https://s3.amazonaws.com/duhaime/blog/tsne-webgl/assets/cat.jpg')
        })
    ]

    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    //

    window.addEventListener('resize', onWindowResize);

    // controls

    controls = new OrbitControls(camera, renderer.domElement);
    controls.autoRotate = false;

    window.addEventListener('resize', onWindowResize);

}

function onWindowResize() {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);

}

function animate() {

    requestAnimationFrame(animate);


    //mesh.rotation.x += 0.005;
    //mesh.rotation.y += 0.01;

    renderer.render(scene, camera);
    controls.update();

}	
</script>
</head>

<body>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.141.0/build/three.module.js"
    }
}
</script>
</body>
</html>
