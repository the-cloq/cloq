<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
	<title>CP</title>
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
  <style>

@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  height: 100%;
}
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background:#f7f7f7;
}
.img_logo {
  width:200px;
}
.img_logo img {
  width:100%;
}
.nowrap {
  white-space:pre;
}
 a {
	 text-decoration: none;
	 color: #0091FA;
	 font-weight: 500;
	 vertical-align: top;
}
#-lnk {
	 position: relative;
	 transition: color 0.3s ease-in-out;
}
#-lnk::before {
	 content: '';
	 position: absolute;
	 top: 100%;
	 width: 100%;
	 height: 1px;
	 background-color: #000;
	 transform: scaleX(0);
	 transition: transform 0.3s ease-in-out;
}
#-lnk:hover {
	 color: #0091FA;
}
#-lnk:hover::before {
	 transform: scaleX(1);
}
h1 {
  font-family: "Montserrat", sans-serif;
  font-size: 32px;
  font-weight: 600;
  line-height:110%;
  letter-spacing: -2px;
  margin:10px 15px;
}
.subline {
  font-family: "Montserrat", sans-serif;
  font-size: 16px;
  font-weight: 600;
  line-height:130%;
  padding-bottom:40px;
}
.tc {
  font-family: "Montserrat", sans-serif;
  font-size: 14px;
  font-weight: 500;
  line-height:130%;
}
.wrapper {
   display: flex;
   flex-direction: row;
   margin: 0 auto;
   max-width: 1920px;
   width: 100%;
   height: 100%;
   position: fixed;
}
svg {
  width:100%;
}
.form {
  display: flex;
}
svg {
   flex-shrink: 0;
   width: 100%;
}
.col {
   display: flex;
   align-items: flex-start;
   align-self: stretch;
   flex: 1 0 0;
   overflow-y: auto;
}
.content {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap:20px;
    overflow: scroll;
}
.image {
   /* background: url(https://unsplash.it/1920/1080) no-repeat; */
   background: url(https://jaseography.xyz/nomadix/captive-portal/coffee_sm_.jpg) no-repeat;
   background-size: cover;
   width:100%;
}
button {
  font-family: "Montserrat", sans-serif;
  padding: 15px 30px;
  background:#0581fc;
  color:white;
  border:none;
  border-radius:30px;
  font-weight: 500;
  font-size:16px;
  margin-bottom:30px;
}
button:hover {
  background:#000;
  cursor:pointer;
}
.c_one {
  display: flex;
  justify-content: space-between;
  flex-basis: 100%; 
  padding: 40px 30px;
  text-align: center;
  background:#fff;
}
.c_two {
  flex-basis: 0%;
}
span {
  white-space: pre;
}

@media (min-width: 576px) {
.c_one {
  flex-basis: 66.66%; 
}
.c_two {
  flex-basis: 33.33%;
}
h1 {
  font-size: 50px;
}
.subline {
  font-size: 16px;
}
button {
  font-size: 16px;
}
}

@media (min-width: 769px) {
 .subline {
  font-size: 18px;
}
.c_one {
  flex-basis: 50%; 
}
.c_two {
  flex-basis: 50%;
}
}
@media (min-width: 1025px) {
 h1 {
  font-size: 60px;
}
 .subline {
  font-size: 22px;
}
 .c_one {
  padding: 30px;
}
}

@media (min-width: 1725px) {
  h1 {
  font-size: 80px;
  margin:30px;
}
 .subline {
  font-size: 24px;
}
 .c_one {
  padding: 40px 80px;
}
}
  </style>
