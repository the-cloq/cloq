<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
	<title>CLOQ Classica</title>
    <meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
  </head>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:wght@100..900&display=swap');
  html, body {margin: 0; height: 100%; overflow: hidden; font-family: "Inter", sans-serif;}

.modal {
  padding:0;
  margin:0;
  overflow-x: hidden; 
  overflow-y: auto;
}
.device_icon {
  display:flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width:40px;
  height:40px;
  border-radius:20px;
  transition: background-color 0.2s ease-in-out;
}
.nope {
  display:flex;
  height: calc(100vh - 120px);
  align-items: center;
  justify-content: center;
  text-align:center;
  width:100%;
  padding:0 50px;
  line-height: 150%;
}
.arrow {
  display:none;
}
.left {
  left:30px;
}
.right {
  right:30px;
}
  .tab, .landscape, .desk {
  display:none;
}
.header {
  display:none;
}
.dot {
    width:8px;
    height:8px;
    border-radius:4px;
    background: #555;
}
.dot_row {
  display:flex;
  align-items: center;
  height:20px;
  background:#f7f7f7;
  gap:10px;
  padding:5px 0;
  width:100%;
}
.main {
  display:flex;
  align-items: center;
  justify-content: center;
  justify-content: space-around;
  background:#ffffff;
  margin-top: 80px;
}
.iframe {
  display:none;
  border: 8px solid #ededed;
  border-radius:25px;
  width:375px;
  height:680px;
  /*transition:all 0.5s cubic-bezier(.19,1,.22,1);*/
}
.mob {
  display:flex;
  border: none; 
}

@media (min-width: 1000px) {
  .iframe {
  display:none;
}
  .mob, .tab {
  display:flex;
  border: none;
}
/*.tab {
  display:flex;
  border: 1px solid #0057FF;
}*/
}
@media (min-width: 1200px) {

  .mob, .tab, .landscape {
  display:flex;
  border: none;
}
/*.landscape {
  display:flex;
  border: 1px solid green;
}*/
}
@media (min-width: 1440px) {
  .header {
  display:flex;
  align-items: center;
  position: fixed;
  top:0;
  height:80px;
  gap:15px;
  padding:0 25px;
  width:100%;
}
  .arrow {
  position:absolute;
  top:calc(50% - 40px);
  display:flex;
  align-items: center;
  justify-content: center;
  width:40px;
  height:40px;
  border-radius:20px;
}

  .iframe {
  display:flex;
  width:1280px;
  height:670px;
  border-radius:10px;
}
.nope {
  display:none;
}
  .mob, .tab, .landscape, .desk {
  display:flex;
  border: none;
}
/*.active {
    border: 1px solid #0057FF;
}*/
}
.reverse {
  rotate:180deg;
}
.active {
    border: 1px solid #0091FA;
}
.device_icon:not(.active):hover {
  background: #2222220A;
  cursor:pointer;
}
.device_icon.active .icon path, .device_icon.active .icon rect, .device_icon:not(.active):hover .icon path, .device_icon:not(.active):hover .icon rect {
  stroke: #000;
}

[hover-tooltip] {
	 position: relative;
}
 [hover-tooltip]:hover::before {
	 content: attr(hover-tooltip);
	 font-size: 11px;
	 text-align: center;
	 position: absolute;
   display: inline-block;
   white-space: nowrap;
	 left: 45%;
	 bottom: calc(100% + 10px);
	 transform: translate(-50%);
	 animation: fade-in 500ms ease;
	 background: rgba(39, 39, 39, 1);
	 border-radius: 3px;
	 padding: 5px 10px;
	 color: #fff;
	 z-index: 1;
}
 [hover-tooltip]:hover::after {
	 content: '';
	 position: absolute;
	 display: inline-block;
   white-space: nowrap;
	 left: 35%;
	 width: 0;
	 height: 0;
	 bottom: calc(100% + 6px);
	 margin-left: - 3px;
	 border: 1px solid black;
	 border-color: rgba(39, 39, 39, 1) transparent transparent transparent;
	 border-width: 4px 6px 0;
	 animation: fade-in 500ms ease;
	 z-index: 1;
}
 [hover-tooltip][tooltip-position="bottom"]:hover::before {
	 right: auto;
	 left: calc(100% + 10px);
}
 [hover-tooltip][tooltip-position="bottom"]:hover::after {
	 right: auto;
	 left: calc(100% + 6px);
	 border-color: transparent transparent rgba(39, 39, 39, 1);
	 border-width: 0 6px 4px;
}
 @keyframes fade-in {
	 from {
		 opacity: 0;
	}
	 to {
		 opacity: 1;
	}
}


#popupContainer {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 300px;
        height: 200px;
        background-color: #fff;
        border: 1px solid #ccc;
        cursor: move;
    }

    #popupHeader {
        background-color: #f0f0f0;
        padding: 10px;
        cursor: move;
    }

    #closePopupBtn {
        cursor: pointer;
        float: right;
        margin-top: -10px;
        margin-right: 5px;
        font-weight: bold;
    }

  </style>
  <body>
    <div class="modal">
      <div class="header">

        <div hover-tooltip="Mobile" tooltip-position="bottom" class="device_icon mob" onclick="mobile()"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="14" height="26" viewBox="0 0 14 26" fill="none">

<path d="M19.1349 7.9175L19.1349 2.97635C19.1349 1.88477 18.25 0.999875 17.1584 0.999875L2.84074 0.999876C1.74916 0.999876 0.864256 1.88478 0.864257 2.97636L0.864257 11.6594C0.864257 12.751 1.74916 13.6359 2.84074 13.6359L8.42349 13.6359C9.51507 13.6359 10.4 14.5208 10.4 15.6124L10.4 17.0957" stroke="#878B9A" stroke-width="1.5" stroke-linecap="round"/>

<path d="M17.6445 0.89502L26.7495 10L17.6445 19.105" stroke="#878B9A" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>

<path d="M1.25 10H26.495" stroke="#878B9A" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>

      </div>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.js"></script>	
      <script>
        $(document).ready(function(){
    $('.device_icon').on('click', function(){
        $('.device_icon').removeClass('active');
        $(this).addClass('active');   
    })
});

document.addEventListener('DOMContentLoaded', function () {
    const openPopupBtn = document.getElementById('openPopupBtn');
    const popupContainer = document.getElementById('popupContainer');
    const closePopupBtn = document.getElementById('closePopupBtn');
    let isDragging = false;
    let offset = { x: 0, y: 0 };

    openPopupBtn.addEventListener('click', () => {
        popupContainer.style.display = 'block';
    });

    closePopupBtn.addEventListener('click', () => {
        popupContainer.style.display = 'none';
    });

    function startDragging(e) {
        isDragging = true;
        offset.x = e.clientX - popupContainer.getBoundingClientRect().left;
        offset.y = e.clientY - popupContainer.getBoundingClientRect().top;
    }

    function stopDragging() {
        isDragging = false;
    }

    function dragPopup(e) {
        if (isDragging) {
            const maxX = window.innerWidth - popupContainer.offsetWidth;
            const maxY = window.innerHeight - popupContainer.offsetHeight;
            let newX = e.clientX - offset.x;
            let newY = e.clientY - offset.y;
            newX = Math.max(0, Math.min(newX, maxX));
            newY = Math.max(0, Math.min(newY, maxY));
            popupContainer.style.left = `${newX}px`;
            popupContainer.style.top = `${newY}px`;
        }
    }

    popupContainer.addEventListener('mousedown', startDragging);
    window.addEventListener('mouseup', stopDragging);
    window.addEventListener('mousemove', dragPopup);
});

function desktop() {
    document.getElementById('device').style.width = '1280px'
    document.getElementById('device').style.height = '670px'

  window.onresize = function() {
  if (window.innerWidth <= 1440) {
    document.getElementById('device').style.width = '1024px'
    document.getElementById('device').style.height = '768px'
  } else {
    document.getElementById('device').style.width = '1280px'
    document.getElementById('device').style.height = '670px'
  }
  if (window.innerWidth <= 1200) {
    document.getElementById('device').style.width = '768px'
    document.getElementById('device').style.height = '1024px'
  }
  if (window.innerWidth <= 1000) {
    document.getElementById('device').style.width = '375px'
    document.getElementById('device').style.height = '812px'
  }
}
}

function tablet_land() {
    document.getElementById('device').style.width = '1024px'
    document.getElementById('device').style.height = '768px'

  window.onresize = function() {
  if (window.innerWidth <= 1200) {
    document.getElementById('device').style.width = '768px'
    document.getElementById('device').style.height = '1024px'
  } else {
    document.getElementById('device').style.width = '1024px'
    document.getElementById('device').style.height = '768px'
  }

  if (window.innerWidth <=1000) {
    document.getElementById('device').style.width = '375px'
    document.getElementById('device').style.height = '812px'
  }
}
}

function tablet() {
    document.getElementById('device').style.width = '768px'
    document.getElementById('device').style.height = '1024px'

  window.onresize = function() {
  if (window.innerWidth <= 1000) {
    document.getElementById('device').style.width = '375px'
    document.getElementById('device').style.height = '812px'
  } else {
    document.getElementById('device').style.width = '768px'
    document.getElementById('device').style.height = '1024px'
  }
}
}

function mobile() {
    document.getElementById('device').style.width = '375px'
    document.getElementById('device').style.height = '812px'

  window.onresize = function() {
  if (window.innerWidth >= 1000) {
    document.getElementById('device').style.width = '375px'
    document.getElementById('device').style.height = '812px'
  }
}
}

      </script>
