body {
  font-family: system-ui, sans-serif;

  margin: 0 auto;

}
.container {
  display:flex;

}
.content {

}

/* toolbox toggle example styling... */
.toolbox-hidden {
  display: none !important;
}

.toolbox-highlight {

}

label {

}
.input-lock-row {

}
.input-unlock-grid .input-row {

}
.input-icon-container {
    display: flex;

    background-color: #00000033;

    padding: 4px;

.input-svg-icon {

  height: 14px;

.input-plain {

  outline: none;

  color: #ececec;
}
.input-plain.input-with-icon {

.text-right {

.input-row {

  align-items: center;

.input-row > .lock-btn {

input[type="color"] {
  border: none;
  background: none;

  height: 32px;
  padding: 0;

}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Hide arrows (spinners) from all number inputs in Firefox */
input[type=number] {
  -moz-appearance: textfield;
}



.color-lozenge {
  display: flex;
  align-items: center;
  border-radius: 999px;
  padding: 2px;
  gap: 10px;
  margin-top: 5px;
}

.color-circle-wrapper {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
}

.color-circle-wrapper input[type="color"] {
  appearance: none;
  -webkit-appearance: none;
  border: none;
  background: none;
  width: 100%;
  height: 100%;
  padding: 0;
  cursor: pointer;
}

.color-circle-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
  border-radius: 50%;
}

.color-circle-wrapper input[type="color"]::-webkit-color-swatch {
  border: none;
  border-radius: 50%;
}

.color-lozenge input[type="text"] {
  width: 70px;
  font-size: 14px;
  padding: 2px 6px;
  border-radius: 6px;
}

.opacity-group {
  display: flex;
  align-items: center;
  margin-left: auto;
}

.no-click-label {
  pointer-events: none;
  user-select: none;
}



.color-circle {
  position: relative;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  overflow: hidden;
  display: inline-block;
}
.color-half {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 50%;
  height: 100%;
  z-index: 1;
}
.color-full {
  left: 0;
  border-top-left-radius: 50% 50%;
  border-bottom-left-radius: 50% 50%;
}
.color-opacity {
  left: 50%;
  border-top-right-radius: 50% 50%;
  border-bottom-right-radius: 50% 50%;
}
.color-circle input[type="color"] {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0;
  z-index: 2;
  cursor: pointer;
}
.color-circle {
  position: relative;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  overflow: hidden;
  display: inline-block;
  /* Add checkered background */
  background: 
    linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%),
    linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%);
  background-color: #fff;
  background-size: 8px 8px;
  background-position: 0 0, 4px 4px;
}

<script>
/** ========== TOOLBOX LOGIC ============= **/

// What tools match what "property keys"
const TOOL_PROP_MAP = {
  fontSize:     ["tool-fontsize"],
  fontWeight:   ["tool-fontweight"],
  borderWidth:  ["tool-borderwidth"],
  borderColor:  ["tool-bordercolor"],
  borderRadius: ["tool-borderradius"],
  padding:      ["tool-padding"],
  backgroundColor: ["tool-bgcolor"],
  color:        ["tool-textcolor"],
  textColor:    ["tool-textcolor"], // synonym
}

// Codec: map data-prop values to tool section IDs
function getToolSectionsForProps(propsArr) {
  // Accepts eg: ['backgroundColor','padding','borderRadius']
  const seen = {};
  let toolIds = [];
  (propsArr||[]).forEach(prop => {
    const keys = TOOL_PROP_MAP[prop] || [];
    keys.forEach(key => {
      if (!seen[key]) { toolIds.push(key); seen[key]=1; }
    });
  });
  return toolIds;
}

// Hide all tools initially
function hideAllToolSections() {
  document
    .querySelectorAll('.container [data-tool]')
    .forEach(section => section.classList.add('toolbox-hidden'));
}

// Show only relevant tool sections
function showToolSections(arr) {
  arr.forEach(toolid => {
    const section = document.getElementById(toolid);
    if(section) section.classList.remove('toolbox-hidden');
  });
}

// Find the toolbox DOM
const toolbox = document.getElementById("toolbox");

let lastEditable = null;
function deselectAllEditable() {
  if(lastEditable) lastEditable.classList.remove("toolbox-highlight");
  lastEditable = null;
}

document.addEventListener("click", e => {
  // Find editable ancestor
  let target = e.target;
  while (target && !target.hasAttribute("data-editable")) {
    target = target.parentElement;
  }
  if (target && target.getAttribute("data-editable")) {
    e.stopPropagation(); // Don't bubble to other docs
    // Highlight
    deselectAllEditable();
    lastEditable = target;
    lastEditable.classList.add("toolbox-highlight");
    // Show toolbox, hide irrelevant tools
    //toolbox.classList.remove("toolbox-hidden");
    hideAllToolSections();
    // Find allowed props for this element
    const editProps = (target.getAttribute("data-edit-props")||"").split(",").map(x=>x.trim()).filter(Boolean);
    showToolSections(getToolSectionsForProps(editProps));
  } else {
    // Click outside: hide toolbox, remove highlighting
    //toolbox.classList.add("toolbox-hidden");
    deselectAllEditable();
  }
});

// --- Helper: Convert hex to rgba ---
function hexToRgba(hex, alpha = 1) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// --- Make input draggable (for % and number fields) ---
function makeInputDraggable(input, min = 0, max = 100, step = 1) {
  let dragging = false;
  let startX = 0;
  let startValue = "";

  input.style.cursor = "ew-resize";

  input.addEventListener("mousedown", e => {
    dragging = true;
    startX = e.clientX;
    startValue = input.value;
    e.preventDefault();
    input.focus();
  });

  window.addEventListener("mouseup", () => (dragging = false));

  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    const delta = Math.round((e.clientX - startX) * 0.3);
    // Support comma-separated (for padding), else single value
    const parts = startValue.split(",").map(v => parseInt(v.trim(), 10));
    const adjusted = parts.map(v => {
      const newVal = v + delta * step;
      return Math.min(Math.max(newVal, min), max);
    });
    input.value = adjusted.length === 2 ? `${adjusted[0]}, ${adjusted[1]}` : `${adjusted[0]}`;
    input.dispatchEvent(new Event("input"));
  });
}

// --- Split color circle updater ---
function updateColorCircle(circleInputId, color, opacity) {
  const input = document.getElementById(circleInputId);
  if (!input) return;
  const circle = input.closest('.color-circle');
  if (!circle) return;
  const full = circle.querySelector('.color-full');
  const opac = circle.querySelector('.color-opacity');
  if (full) full.style.background = color;
  if (opac) opac.style.background = hexToRgba(color, opacity);
}

// --- Button styling state and apply function ---
const button = document.getElementById("customButton");
const state = {
  base: {
    fontSize: "16px",
    fontWeight: "400",
    padding: "10px 20px",
    backgroundColor: "#FFFFFF",
    color: "#000000",
    border: "1px solid #000000",
    borderRadius: "4px",
  }
};
function applyStyles() {
  Object.assign(button.style, state.base);
}

// === TEXT COLOR ===
const baseTextColorInput = document.getElementById("baseTextColor");
const baseTextHexInput = document.getElementById("baseTextHex");
const baseTextOpacityInput = document.getElementById("baseTextOpacityDrag");

let textColorHex = baseTextColorInput.value;
let textOpacity = 1;

function updateTextColor() {
  state.base.color = hexToRgba(textColorHex, textOpacity);
  applyStyles();
  updateColorCircle('baseTextColor', textColorHex, textOpacity);
}
baseTextColorInput.addEventListener("input", e => {
  textColorHex = e.target.value;
  baseTextHexInput.value = textColorHex;
  updateTextColor();
});
baseTextHexInput.addEventListener("input", e => {
  let val = e.target.value;
  if (/^#([0-9A-Fa-f]{6})$/.test(val)) {
    textColorHex = val;
    baseTextColorInput.value = textColorHex;
    updateTextColor();
  }
});
baseTextOpacityInput.addEventListener("input", () => {
  const num = parseInt(baseTextOpacityInput.value.replace(/[^\d]/g, ""), 10);
  if (!isNaN(num)) {
    textOpacity = Math.min(100, Math.max(0, num)) / 100;
    baseTextOpacityInput.value = `${num}%`;
    updateTextColor();
  }
});
makeInputDraggable(baseTextOpacityInput, 0, 100, 1);

// === BG COLOR ===
const baseBgColorInput = document.getElementById("baseBgColor");
const baseBgHexInput = document.getElementById("baseBgHex");
const baseBgOpacityInput = document.getElementById("baseBgOpacityDrag");

let bgColorHex = baseBgColorInput.value;
let bgOpacity = 1;

function updateBgColor() {
  state.base.backgroundColor = hexToRgba(bgColorHex, bgOpacity);
  applyStyles();
  updateColorCircle('baseBgColor', bgColorHex, bgOpacity);
}
baseBgColorInput.addEventListener("input", e => {
  bgColorHex = e.target.value;
  baseBgHexInput.value = bgColorHex;
  updateBgColor();
});
baseBgHexInput.addEventListener("input", e => {
  const val = e.target.value;
  if (/^#([0-9A-Fa-f]{6})$/.test(val)) {
    bgColorHex = val;
    baseBgColorInput.value = val;
    updateBgColor();
  }
});
baseBgOpacityInput.addEventListener("input", () => {
  const num = parseInt(baseBgOpacityInput.value.replace(/[^\d]/g, ""), 10);
  if (!isNaN(num)) {
    bgOpacity = Math.min(100, Math.max(0, num)) / 100;
    baseBgOpacityInput.value = `${num}%`;
    updateBgColor();
  }
});
makeInputDraggable(baseBgOpacityInput, 0, 100, 1);

// === BORDER COLOR ===
const borderColorInput = document.getElementById("borderColorInput");
const borderHexInput = document.getElementById("borderHexInput");
const borderOpacityInput = document.getElementById("borderOpacityInput");
const borderWidthInput = document.getElementById("borderWidthInput");

let borderColorHex = borderColorInput.value;
let borderOpacity = 1;

function updateBorder() {
  const width = parseInt(borderWidthInput.value, 10);
  const color = hexToRgba(borderColorHex, borderOpacity);
  state.base.border = width > 0 ? `${width}px solid ${color}` : "none";
  applyStyles();
  updateColorCircle('borderColorInput', borderColorHex, borderOpacity);
}
borderColorInput.addEventListener("input", e => {
  borderColorHex = e.target.value;
  borderHexInput.value = borderColorHex;
  updateBorder();
});
borderHexInput.addEventListener("input", e => {
  const val = e.target.value;
  if (/^#([0-9A-Fa-f]{6})$/.test(val)) {
    borderColorHex = val;
    borderColorInput.value = val;
    updateBorder();
  }
});
borderOpacityInput.addEventListener("input", () => {
  const num = parseInt(borderOpacityInput.value.replace(/[^\d]/g, ""), 10);
  if (!isNaN(num)) {
    borderOpacity = Math.min(100, Math.max(0, num)) / 100;
    borderOpacityInput.value = `${num}%`;
    updateBorder();
  }
});
makeInputDraggable(borderOpacityInput, 0, 100, 1);
borderWidthInput.addEventListener("input", updateBorder);
makeInputDraggable(borderWidthInput, 0, 16, 1);

// === FONT CONTROLS ===
const fontSizeInput = document.getElementById("fontSizeInput");
const fontWeightInput = document.getElementById("fontWeightInput");

fontSizeInput.addEventListener("input", () => {
  state.base.fontSize = `${fontSizeInput.value}px`;
  applyStyles();
});
makeInputDraggable(fontSizeInput, 1, 200, 1);

fontWeightInput.addEventListener("input", () => {
  state.base.fontWeight = fontWeightInput.value;
  applyStyles();
});
makeInputDraggable(fontWeightInput, 100, 900, 100);

// === PADDING CONTROLS ===
const lockedPadding = document.getElementById("lockedPadding");
const individualPadding = document.getElementById("individualPadding");
const paddingYInput = document.getElementById("paddingYInput");
const paddingXInput = document.getElementById("paddingXInput");
const paddingTop = document.getElementById("paddingTopNumber");
const paddingRight = document.getElementById("paddingRightNumber");
const paddingBottom = document.getElementById("paddingBottomNumber");
const paddingLeft = document.getElementById("paddingLeftNumber");
const togglePaddingBtn = document.getElementById("togglePaddingMode");
const togglePaddingBtn2 = document.getElementById("togglePaddingMode2");

let isLocked = true;

function parseLockedValue(val) {
  const parts = val.split(",").map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
  if (parts.length === 2) return parts;
  if (parts.length === 1) return [parts[0], parts[0]];
  return [0, 0];
}
function syncLockedFromIndividual() {
  const t = parseInt(paddingTop.value, 10) || 0;
  const b = parseInt(paddingBottom.value, 10) || 0;
  const l = parseInt(paddingLeft.value, 10) || 0;
  const r = parseInt(paddingRight.value, 10) || 0;
  paddingYInput.value = t === b ? `${t}` : `${t}, ${b}`;
  paddingXInput.value = l === r ? `${l}` : `${l}, ${r}`;
  updatePaddingStyle();
}
function syncIndividualFromLocked() {
  const [t, b] = parseLockedValue(paddingYInput.value);
  const [l, r] = parseLockedValue(paddingXInput.value);
  paddingTop.value = t;
  paddingBottom.value = b;
  paddingLeft.value = l;
  paddingRight.value = r;
  updatePaddingStyle();
}
function updatePaddingStyle() {
  const t = parseInt(paddingTop.value, 10) || 0;
  const r = parseInt(paddingRight.value, 10) || 0;
  const b = parseInt(paddingBottom.value, 10) || 0;
  const l = parseInt(paddingLeft.value, 10) || 0;
  state.base.padding = `${t}px ${r}px ${b}px ${l}px`;
  applyStyles();
}
function togglePaddingLock() {
  isLocked = !isLocked;
  togglePaddingBtn.classList.toggle("locked", isLocked);
  togglePaddingBtn.classList.toggle("unlocked", !isLocked);
  togglePaddingBtn2.classList.toggle("locked", isLocked);
  togglePaddingBtn2.classList.toggle("unlocked", !isLocked);
  lockedPadding.style.display = isLocked ? "flex" : "none";
  individualPadding.style.display = isLocked ? "none" : "block";
  isLocked ? syncLockedFromIndividual() : syncIndividualFromLocked();
}
togglePaddingBtn.addEventListener("click", togglePaddingLock);
togglePaddingBtn2.addEventListener("click", togglePaddingLock);
[paddingYInput, paddingXInput].forEach(input => {
  input.addEventListener("input", syncIndividualFromLocked);
  makeInputDraggable(input);
});
[paddingTop, paddingRight, paddingBottom, paddingLeft].forEach(input => {
  input.addEventListener("input", () => {
    isLocked ? syncLockedFromIndividual() : updatePaddingStyle();
  });
  makeInputDraggable(input);
});

// === BORDER RADIUS CONTROLS ===
const borderRadiusAllInput = document.getElementById("borderRadiusAllInput");
makeInputDraggable(borderRadiusAllInput);
const borderRadiusTop = document.getElementById("borderRadiusTopNumber");
const borderRadiusRight = document.getElementById("borderRadiusRightNumber");
const borderRadiusBottom = document.getElementById("borderRadiusBottomNumber");
const borderRadiusLeft = document.getElementById("borderRadiusLeftNumber");
const toggleBorderRadiusBtn = document.getElementById("toggleBorderRadiusMode");
const individualBorderRadius = document.getElementById("individualBorderRadius");

let borderRadiusIsLocked = true;
let borderRadiusIsMixed = false;

function allCornersEqual() {
  const t = borderRadiusTop.value;
  const r = borderRadiusRight.value;
  const b = borderRadiusBottom.value;
  const l = borderRadiusLeft.value;
  return t === r && t === b && t === l;
}
function syncAllInputFromIndividuals() {
  if (allCornersEqual()) {
    borderRadiusAllInput.value = borderRadiusTop.value;
    borderRadiusIsMixed = false;
    borderRadiusAllInput.style.cursor = "ew-resize";
  } else {
    borderRadiusAllInput.value = "Mixed";
    borderRadiusIsMixed = true;
    borderRadiusAllInput.style.cursor = "text";
    updateBorderRadiusStyle();
  }
}
function syncIndividualsFromAllInput() {
  const val = parseInt(borderRadiusAllInput.value, 10);
  if (!isNaN(val)) {
    borderRadiusTop.value = val;
    borderRadiusRight.value = val;
    borderRadiusBottom.value = val;
    borderRadiusLeft.value = val;
    borderRadiusIsMixed = false;
    borderRadiusAllInput.style.cursor = "ew-resize";
    updateBorderRadiusStyle();
  }
}
function updateBorderRadiusStyle() {
  const t = parseInt(borderRadiusTop.value, 10) || 0;
  const r = parseInt(borderRadiusRight.value, 10) || 0;
  const b = parseInt(borderRadiusBottom.value, 10) || 0;
  const l = parseInt(borderRadiusLeft.value, 10) || 0;
  state.base.borderRadius = `${t}px ${r}px ${b}px ${l}px`;
  applyStyles();
}
borderRadiusAllInput.addEventListener("input", () => {
  if (borderRadiusAllInput.value !== "Mixed") {
    syncIndividualsFromAllInput();
  }
});
[borderRadiusTop, borderRadiusRight, borderRadiusBottom, borderRadiusLeft].forEach(input => {
  input.addEventListener("input", () => {
    syncAllInputFromIndividuals();
    updateBorderRadiusStyle();
  });
  makeInputDraggable(input);
});
toggleBorderRadiusBtn.addEventListener("click", () => {
  borderRadiusIsLocked = !borderRadiusIsLocked;
  toggleBorderRadiusBtn.classList.toggle("locked", borderRadiusIsLocked);
  toggleBorderRadiusBtn.classList.toggle("unlocked", !borderRadiusIsLocked);
  individualBorderRadius.style.display = borderRadiusIsLocked ? "none" : "block";
});

// === INITIALIZE ===
syncLockedFromIndividual();
syncAllInputFromIndividuals();
updateBorderRadiusStyle();
applyStyles();
updateColorCircle('baseTextColor', textColorHex, textOpacity);
updateColorCircle('baseBgColor', bgColorHex, bgOpacity);
updateColorCircle('borderColorInput', borderColorHex, borderOpacity);


const toggleBtn = document.getElementById('modeToggle');

toggleBtn.addEventListener('click', () => {
  const body = document.body;
  const container = document.querySelector('.container');
  const content = document.querySelector('.content');

  // Toggle light mode class on body and container/content
  body.classList.toggle('light-mode');
  container.classList.toggle('light-mode');
  content.classList.toggle('light-mode');

  // Update toggle text accordingly
  if (body.classList.contains('light-mode')) {
    toggleBtn.textContent = 'Dark';
  } else {
    toggleBtn.textContent = 'Light';
  }
});

</script>
</body>
</html>
