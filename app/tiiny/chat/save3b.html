<body>

    <div class="wrap">
        <div class="card-container">
            <div class="card" id="flipCard">
              <div class="side front">
                <h3>Location</h3>
                <div class="input-row" style="flex-direction:column">
                  <div style="display:flex; align-items:center; gap:20px; width:100%;">
                    <input type="text" id="location" name="cityName" placeholder="City, Countrycode" onblur="this.value=removeSpaceAfterComma(this.value);" value="Mission Beach,AU">

  <div id="solar" class="box-large">
    <h3>Solar Terminator</h3>
    <div class="top_container">
    <h4 id="primaryTimeString"></h4>
    <div style="display:flex;flex-direction: column;margin-top: 30px;">
    <div id="localTime"></div>
    <div id="timezoneOffset"></div>
    <input type="hidden" id="timezoneOffsetInput" name="timezoneOffset">
</div>
</div>
    <svg id="sunPath" xmlns="http://www.w3.org/2000/svg" width="335" height="73" viewBox="0 0 335 73" fill="none">
      <path id="sun-path" d="M0 69.9C56.2 69.9 111.3 3 167.5 3C227.2 3 274.4 69.9 335 69.9" stroke="white" stroke-opacity="0.2" stroke-width="5"></path>
      <circle id="sun-glow" r="10" fill="#FFC300"></circle>
      <circle id="sunrisemarker" r="4" fill="#FFD700" opacity="0.8"></circle>
      <circle id="sunsetmarker" r="4" fill="#FF6347" opacity="0.8"></circle>
    </svg>
    <h5 id="secondaryTimeString"></h5>
    <p id="daylightHours"></p>
  </div>
</div>
  <!--<p id="currentLocalTime">Your local time:</p>-->

  <script>
     document.addEventListener('DOMContentLoaded', function () {
  document.getElementById("submit-location").addEventListener("click", fetchSunData);

  //let timezoneOffset = 0;
  //let isDST = false;
  let pathElement;
  let pathLength;
  let cachedData = {};  // Cache variable to store previously fetched data

  function updateSunPosition() {
  const nowUTC = new Date();
  let nowLocal = new Date(nowUTC.getTime() + timezoneOffset);
  if (isDST) nowLocal = new Date(nowLocal.getTime() - 3600000);

  if (sunriseLocal && sunsetLocal) {  // Ensure values exist before updating background
    updateBackgroundColor(nowLocal, sunriseLocal, sunsetLocal);
  }
}

function fetchSunData() {
  const location = document.getElementById("location").value.trim();
  const apiKey = document.getElementById("apikey").value.trim();

  // Validate the input before proceeding with the API call
  if (!location || !apiKey) {
    alert("Please provide a valid location and API key.");
    return;
  }

  // Check if the location data is already cached
  if (cachedData[location]) {
    // Use cached data if available
    updateSunData(cachedData[location]);
    console.log("Using cached data for location:", location);
    return;
  }

  // Construct the API URL
  const apiURL = `https://api.openweathermap.org/data/2.5/weather?q=${location}&appid=${apiKey}`;

  // Proceed with the API request
  fetch(apiURL)
    .then(response => response.json())
    .then(data => {
      if (!data.sys) {
        // Handle invalid location or API response
        alert("Invalid location. Please try again.");
        return;
      }

      // Cache the data for the location
      cachedData[location] = data;
      updateSunData(data);  // Update the sun data based on the API response
    })
    .catch(error => {
      console.error("Error fetching sun data:", error);
      alert("Error fetching data. Please try again later.");
    });
}

function updateSunData(data) {
  // Extract relevant information from the API data
  timezoneOffset = data.timezone * 1000;  // Timezone offset in milliseconds
  pathElement = document.getElementById("sun-path");
  pathLength = pathElement.getTotalLength();

  const nowUTC = new Date();
  let nowLocal = new Date(nowUTC.getTime() + timezoneOffset);

  const janOffset = new Date(nowLocal.getFullYear(), 0, 1).getTimezoneOffset(); // January offset (standard time)
  const julOffset = new Date(nowLocal.getFullYear(), 6, 1).getTimezoneOffset(); // July offset (daylight time)
  isDST = nowLocal.getTimezoneOffset() < Math.max(janOffset, julOffset); // DST is true if the current offset is less than the max of Jan and Jul

  if (isDST) nowLocal = new Date(nowLocal.getTime() - 3600000);  // Adjust for DST

  document.getElementById("localTime").innerHTML = `<img src="time.svg"> ${nowLocal.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

  const daylightHours = (data.sys.sunset - data.sys.sunrise) / 60;
  const hours = Math.floor(daylightHours / 60);
  const minutes = Math.round(daylightHours % 60);
  document.getElementById("daylightHours").innerHTML = `<span>Daylight hours today:</span> ${hours}hrs ${minutes}min`;

  // Calculate sunrise and sunset times
  const sunriseUTC = new Date(data.sys.sunrise * 1000);
  const sunsetUTC = new Date(data.sys.sunset * 1000);
  let sunriseLocal = new Date(sunriseUTC.getTime() + timezoneOffset);
  let sunsetLocal = new Date(sunsetUTC.getTime() + timezoneOffset);

  if (isDST) {
    sunriseLocal = new Date(sunriseLocal.getTime() - 3600000); // Adjust for DST
    sunsetLocal = new Date(sunsetLocal.getTime() - 3600000); // Adjust for DST
  }

  // Add twilight (20 minutes before and after sunrise/sunset)
  const twilightBefore = 20 * 60 * 1000; // 20 minutes in milliseconds
  const twilightAfter = 20 * 60 * 1000;  // 20 minutes in milliseconds

  const twilightStart = new Date(sunriseLocal.getTime() - twilightBefore);
  const twilightEnd = new Date(sunsetLocal.getTime() + twilightAfter);

  updateBackgroundColor(new Date(), sunriseLocal, sunsetLocal);

  document.getElementById("primaryTimeString").innerHTML = `<span class="highlight">Sunset</span>${sunsetLocal.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  document.getElementById("secondaryTimeString").innerHTML = `<span class="highlight">Sunrise Tomorrow</span>${sunriseLocal.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

  // Update sunrise and sunset times based on current time
  if (nowLocal < sunriseLocal) {
    document.getElementById("primaryTimeString").innerHTML = `<span class="highlight">Sunrise</span>${sunriseLocal.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    document.getElementById("secondaryTimeString").innerHTML = `<span class="highlight">Sunset</span>${sunsetLocal.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  } else if (nowLocal >= sunsetLocal) {
    // Add 2 minutes (120,000 ms) to sunrise and sunset times only here
    const sunriseTomorrow = new Date(sunriseLocal.getTime() + 2 * 60000); // Add 2 minutes
    const sunsetTomorrow = new Date(sunsetLocal.getTime() + 2 * 60000);   // Add 2 minutes

    document.getElementById("primaryTimeString").innerHTML = `<span class="highlight">Sunrise Tomorrow</span>${sunriseTomorrow.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    document.getElementById("secondaryTimeString").innerHTML = `<span class="highlight">Sunset Tomorrow</span>${sunsetTomorrow.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  }

  // Update sunrise and sunset markers
  updateMarker("sunrisemarker", sunriseLocal);
  updateMarker("sunsetmarker", sunsetLocal);
  updateBackgroundColor(nowLocal, twilightStart, twilightEnd);
  updateSunPosition();

  if (isDST) {
    let timezoneOffsetInput = parseInt(document.getElementById("timezoneOffsetInput").value) || 0;

    if (data.timezone === 3600) {
        // BST (London, UK) -> Hide timezone offset
        document.getElementById("timezoneOffset").style.display = "none";  // Hide for BST

        // For BST, the hidden input value should be set to 0 (since BST is effectively UTC)
        timezoneOffsetInput = 0;
        document.getElementById("timezoneOffsetInput").value = timezoneOffsetInput;  // Update hidden input value

    } else if (data.timezone === 7200) {
        // CEST (Paris, France) -> Show timezone offset as +1 hr
        document.getElementById("timezoneOffset").style.display = "block";  // Show for CEST
        document.getElementById("timezoneOffset").innerHTML = `+1`;  // Set display as +1 hrs

        // For CEST, the hidden input value should be 3600 (adjusted for DST)
        timezoneOffsetInput = 3600;
        document.getElementById("timezoneOffsetInput").value = timezoneOffsetInput;  // Update hidden input value

    } else {
        // For other timezones
        document.getElementById("timezoneOffset").style.display = "block";  // Show for other timezones
        displayTimezoneOffset(data.timezone);

        // Use the timezone offset directly (since it's already in seconds)
        timezoneOffsetInput = data.timezone;  // No need to divide by 1000

        document.getElementById("timezoneOffsetInput").value = timezoneOffsetInput;  // Update hidden input value
    }

} else {
    // For non-DST (standard time)
    document.getElementById("timezoneOffset").style.display = "block";  // Show for non-DST
    displayTimezoneOffset(data.timezone);

    // Use the timezone offset directly (since it's already in seconds)
    timezoneOffsetInput = data.timezone;  // No need to divide by 1000

    document.getElementById("timezoneOffsetInput").value = timezoneOffsetInput;  // Update hidden input value
}

// Log the updated value for debugging
console.log("Updated timezoneOffsetInput value: " + document.getElementById("timezoneOffsetInput").value);
console.log("isDST:", isDST); // Tells me wether DST is being observed.


  setInterval(updateSunPosition, 30000);
}
function displayTimezoneOffset(offsetInSeconds) {
  // Convert seconds to hours and minutes
  const offsetInHours = offsetInSeconds / 3600;
  const sign = offsetInHours >= 0 ? '+' : '-';
  const offsetFormatted = sign + Math.abs(offsetInHours); // For example, +6 or -4

  document.getElementById("timezoneOffset").innerHTML = `${offsetFormatted}`; //Timezone Offset
}


  function updateBackgroundColor(nowLocal, twilightStart, twilightEnd) {
    const solarBox = document.getElementById("solar");
    const sunGlow = document.getElementById("sun-glow");
    
    console.log("Now:", nowLocal.toLocaleTimeString());
    console.log("Twilight Start:", twilightStart.toLocaleTimeString());
    console.log("Twilight End:", twilightEnd.toLocaleTimeString());

    // Check if now is during twilight or nighttime
    if (nowLocal < twilightStart || nowLocal >= twilightEnd) {
        solarBox.style.backgroundColor = "#00000069";  // Nighttime
        sunGlow.setAttribute("fill", "#a6a6a6");   // Make sun gray during twilight
    } else {
        solarBox.style.backgroundColor = "";       // Daytime
        sunGlow.setAttribute("fill", "yellow");    // Restore sun color in daytime
    }

}
  function updateSunPosition() {
    const nowUTC = new Date();
    let nowLocal = new Date(nowUTC.getTime() + timezoneOffset);
    if (isDST) nowLocal = new Date(nowLocal.getTime() - 3600000);

    const secondsSinceStartOfDay = nowLocal.getHours() * 3600 + nowLocal.getMinutes() * 60 + nowLocal.getSeconds();
    const fractionOfDay = secondsSinceStartOfDay / 86400;
    const sunPosition = fractionOfDay * pathLength;
    const sunCoordinates = pathElement.getPointAtLength(sunPosition);

    document.getElementById("sun-glow").setAttribute("cx", sunCoordinates.x);
    document.getElementById("sun-glow").setAttribute("cy", sunCoordinates.y);
    
  }

  function updateMarker(id, time) {
    const fraction = (time.getHours() * 3600 + time.getMinutes() * 60) / 86400;
    const markerPosition = fraction * pathLength;
    const markerCoordinates = pathElement.getPointAtLength(markerPosition);

    document.getElementById(id).setAttribute("cx", markerCoordinates.x);
    document.getElementById(id).setAttribute("cy", markerCoordinates.y);
  }

  window.onload = fetchSunData;
  setInterval(() => {
    //document.getElementById("currentLocalTime").innerText = `Your local time: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  }, 1000);

});

// Function to flip the card
function flipCard() {
    const card = document.getElementById('flipCard');
    card.classList.toggle('flip');
}

function removeSpaces(string){return string.split(' ').join('');}
function removeSpaceAfterComma(string){return string.replace(", ", ",");}
    </script>
