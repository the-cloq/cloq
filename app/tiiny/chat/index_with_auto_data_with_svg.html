<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Sun Path Visualization</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    #sunPath {
      display: block;
      margin: 20px auto;
      width: 100%;
      max-width: 335px;
    }
    .input-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    input[type="text"] {
      margin: 10px 0;
      padding: 10px;
      width: 250px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #222;
      color: white;
    }
    #submit-location {
      background-color: #007bff;
      padding: 10px 20px;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }
    #submit-location:hover {
      background-color: #0056b3;
    }
    #localTime {
      margin-top: 20px;
      font-size: 18px;
      color: #FFD700;
    }
    h4, h5 {
      font-size: 18px;
      color: #FFD700;
    }
    p {
      font-size: 16px;
      color: #FFD700;
    }

    /* Flex container for sunrise and sunset times */
    .time-row {
      display: flex;
      justify-content: center;
      flex-direction:column;
      align-items: center;
      margin-top: 20px;
      gap:20px;
    }

    /* Styles for sunrise and sunset icons */
    #primaryTimeString, #secondaryTimeString {
      display: inline-flex;
      align-items: center;
      margin: 0 10px;
      font-size: 18px;
      color: #FFD700;
    }

    /* Sunrise icon (primary time) */
    #primaryTimeString {
      background-image: url("data:image/svg+xml,%3Csvg width='25' height='24' viewBox='0 0 25 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg clip-path='url(%23clip0_1997_790)'%3E%3Cpath d='M12.2812 3.5V17' stroke='%23F6C543' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M23.2812 21H1.28125' stroke='white' stroke-width='1.3125' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16.2812 6.5L12.2812 2.5L8.28125 6.5' stroke='%23F6C543' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3Cdefs%3E%3CclipPath id='clip0_1997_790'%3E%3Crect width='24' height='24' fill='white' transform='translate(0.28125)'/%3E%3C/clipPath%3E%3C/defs%3E%3C/svg%3E%0A");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      width: 24px;
      height: 24px;
      margin-right: 10px;
    }

    /* Sunset icon (secondary time) */
    #secondaryTimeString {
      background-image: url("data:image/svg+xml,%3Csvg width='25' height='24' viewBox='0 0 25 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cg clip-path='url(%23clip0_1959_746)'%3E%3Cpath d='M12.2812 16V2.5' stroke='%23F6C543' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M23.2812 21H1.28125' stroke='white' stroke-width='1.3125' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16.2812 12L12.2812 16L8.28125 12' stroke='%23F6C543' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3Cdefs%3E%3CclipPath id='clip0_1959_746'%3E%3Crect width='24' height='24' fill='white' transform='translate(0.28125)'/%3E%3C/clipPath%3E%3C/defs%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      width: 24px;
      height: 24px;
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <h1>Sun Path Visualization</h1>
  
  <!-- SVG for sun path and markers -->
  <svg id="sunPath" xmlns="http://www.w3.org/2000/svg" width="335" height="73" viewBox="0 0 335 73" fill="none">
    <path id="sun-path" d="M0 69.8975C56.1994 69.8975 111.319 3 167.541 3C227.168 3 274.438 69.8975 335 69.8975" stroke="white" stroke-opacity="0.2" stroke-width="5"></path>
    <circle id="sun-glow" r="10" fill="#FFC300"></circle>
    <circle id="sunrisemarker" r="4" fill="#FFD700" opacity="0.8"></circle>
    <circle id="sunsetmarker" r="4" fill="#FF6347" opacity="0.8"></circle>
  </svg>

  <!-- Input Fields for Location and API Key -->
  <div class="input-row">
    <input type="text" id="location" name="cityName" placeholder="City, Countrycode" value="London,GB">
    <input type="text" id="apikey" name="APIKEY" placeholder="32 Character API Key" value="409cc3736e4fa7176890bed5e9656117">
    <div id="submit-location">Submit Location</div>
  </div>
  
  <!-- Local Time Display -->
  <div class="toggle-item g40">
    <p id="localTime">Local time: --:--</p>
  </div>

  <!-- Sunrise and Sunset Times with Icons in Flex Container -->
  <div class="time-row">
    <h4 id="primaryTimeString"> --:--</h4>
    <h5 id="secondaryTimeString"> --:--</h5>
  </div>

  <p id="currentLocalTime">Your local time: --:--:--</p>
  
  <!-- Total Daylight Hours -->
  <p id="daylightHours">Total daylight hours: --</p>

<script>
  document.getElementById("submit-location").addEventListener("click", function () {
    const location = document.getElementById("location").value.trim();
    const apiKey = document.getElementById("apikey").value.trim();

    if (!location || !apiKey) {
      alert("Please provide a valid location and API key.");
      return;
    }

    const [cityName, countryCode] = location.split(",").map(str => str.trim());
    const apiURL = `https://api.openweathermap.org/data/2.5/weather?q=${cityName},${countryCode}&appid=${apiKey}`;

    fetch(apiURL)
      .then(response => response.json())
      .then(data => {
        if (data.cod !== 200) {
          alert(`Failed to retrieve weather data: ${data.message}`);
          return;
        }
      
        // Retrieve the necessary data
        const timezoneOffset = data.timezone * 1000; // Convert to milliseconds
        const nowUTC = new Date();
        let nowLocal = new Date(nowUTC.getTime() + timezoneOffset);

        // Use the current date to check if DST is in effect
        const currentDate = new Date();
        const standardTimezoneOffset = new Date(currentDate.getFullYear(), 0, 1).getTimezoneOffset();
        const currentTimezoneOffset = currentDate.getTimezoneOffset();

        // Check if the timezone offset differs from the standard time (i.e., DST is in effect)
        const isDST = currentTimezoneOffset < standardTimezoneOffset;

        // Adjust for DST automatically
        if (isDST) {
          nowLocal.setHours(nowLocal.getHours() - 1); // Subtract 1 hour for DST
        }

        const localHours = nowLocal.getHours();
        const localMinutes = nowLocal.getMinutes();
        const localSeconds = nowLocal.getSeconds();
        const secondsSinceStartOfDay = localHours * 3600 + localMinutes * 60 + localSeconds;
        const fractionOfDay = secondsSinceStartOfDay / 86400; // 86400 seconds in a day

        // Update local time display
        document.getElementById("localTime").innerText = `Local time: ${nowLocal.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

        // Map the sun's position along the path
        const pathElement = document.getElementById("sun-path");
        const pathLength = pathElement.getTotalLength();
        const sunPosition = fractionOfDay * pathLength;

        // Get the coordinates along the path
        const sunCoordinates = pathElement.getPointAtLength(sunPosition);
        const sunGlow = document.getElementById("sun-glow");
        sunGlow.setAttribute("cx", sunCoordinates.x);
        sunGlow.setAttribute("cy", sunCoordinates.y);

        // Calculate sunrise and sunset times in seconds since the start of the day
        const sunriseTime = data.sys.sunrise * 1000 + timezoneOffset;
        const sunsetTime = data.sys.sunset * 1000 + timezoneOffset;

        const sunriseDate = new Date(sunriseTime);
        const sunsetDate = new Date(sunsetTime);

        const sunriseTimeString = sunriseDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const sunsetTimeString = sunsetDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Update times with appropriate icons
        document.getElementById("primaryTimeString").innerHTML = `<span id="primaryTimeString"></span> ${sunriseTimeString}`;
        document.getElementById("secondaryTimeString").innerHTML = `<span id="secondaryTimeString"></span> ${sunsetTimeString}`;

        // Calculate daylight hours
        let daylightHours = (sunsetDate - sunriseDate) / 3600000; // Convert to hours
        daylightHours = daylightHours.toFixed(2); // Round to 2 decimal places

        document.getElementById("daylightHours").innerText = `Total daylight hours: ${daylightHours}`;
      })
      .catch(error => {
        console.error("Error fetching weather data:", error);
        alert("Failed to retrieve weather data.");
      });
  });

  function updateLocalTime() {
    const now = new Date();
    document.getElementById("currentLocalTime").innerText = `Your local time: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  }
  setInterval(updateLocalTime, 1000); // Update every second
  updateLocalTime(); // Initial call
</script>

</body>
</html>
