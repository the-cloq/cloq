<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Path Visualization</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    #sunPath {
      display: block;
      margin: 20px auto;
      width: 100%;
      max-width: 335px;
    }
    .input-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    input[type="text"] {
      margin: 10px 0;
      padding: 10px;
      width: 250px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #222;
      color: white;
    }
    #submit-location {
      background-color: #007bff;
      padding: 10px 20px;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }
    #submit-location:hover {
      background-color: #0056b3;
    }
    #localTime {
      margin-top: 20px;
      font-size: 18px;
      color: #FFD700;
    }
    h4, h5 {
      font-size: 18px;
      color: #FFD700;
    }
    p {
      font-size: 16px;
      color: #FFD700;
    }
  </style>
</head>
<body>

  <h1>Sun Path Visualization</h1>
  
  <svg id="sunPath" xmlns="http://www.w3.org/2000/svg" width="335" height="73" viewBox="0 0 335 73" fill="none">
    <path id="sun-path" d="M0 69.8975C56.1994 69.8975 111.319 3 167.541 3C227.168 3 274.438 69.8975 335 69.8975" stroke="white" stroke-opacity="0.2" stroke-width="5"></path>
    <circle id="sun-glow" r="10" fill="#FFC300"></circle>
    <circle id="sunrisemarker" r="4" fill="#FFD700" opacity="0.8"></circle>
    <circle id="sunsetmarker" r="4" fill="#FF6347" opacity="0.8"></circle>
  </svg>

  <div class="input-row">
    <input type="text" id="location" name="cityName" placeholder="City, Countrycode" value="London,GB">
    <input type="text" id="apikey" name="APIKEY" placeholder="32 Character API Key" value="409cc3736e4fa7176890bed5e9656117">
    <div id="submit-location">Submit Location</div>
  </div>
  
  <div class="toggle-item g40">
    <p id="localTime">Local time: --:--</p>
  </div>

  <h4 id="sunriseTime">Sunrise: --:--</h4>
  <h5 id="sunsetTime">Sunset: --:--</h5>

  <p id="currentLocalTime">Your local time: --:--</p>
  
  <p id="daylightHours">Total daylight hours: --</p>
<script>
    document.getElementById("submit-location").addEventListener("click", fetchSunData);

    function fetchSunData() {
      const location = document.getElementById("location").value.trim();
      const apiKey = document.getElementById("apikey").value.trim();
      
      if (!location || !apiKey) {
        alert("Please provide a valid location and API key.");
        return;
      }

      const [cityName, countryCode] = location.split(",").map(str => str.trim());
      const apiURL = `https://api.openweathermap.org/data/2.5/weather?q=${cityName},${countryCode}&appid=${apiKey}`;

      fetch(apiURL)
        .then(response => response.json())
        .then(data => {
          if (data.cod !== 200) {
            alert(`Failed to retrieve weather data: ${data.message}`);
            return;
          }
        
          const timezoneOffset = data.timezone * 1000;
          const nowUTC = new Date();
          let nowLocal = new Date(nowUTC.getTime() + timezoneOffset);

          const localTimeElement = document.getElementById("localTime");
          if (localTimeElement) {
            localTimeElement.innerText = `Local time: ${nowLocal.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
          }

          const sunriseTime = new Date(data.sys.sunrise * 1000 + timezoneOffset);
          const sunsetTime = new Date(data.sys.sunset * 1000 + timezoneOffset);

          document.getElementById("sunriseTime").innerText = `Sunrise: ${sunriseTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
          document.getElementById("sunsetTime").innerText = `Sunset: ${sunsetTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

          let daylightHours = (sunsetTime - sunriseTime) / 3600000;
          document.getElementById("daylightHours").innerText = `Total daylight hours: ${daylightHours.toFixed(2)}`;
        })
        .catch(error => {
          console.error("Error fetching weather data:", error);
          alert("Failed to retrieve weather data. Please check the city name, country code, and API key.");
        });
    }

    function updateLocalTime() {
      const now = new Date();
      document.getElementById("currentLocalTime").innerText = `Your local time: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    }

    setInterval(updateLocalTime, 60000);
    updateLocalTime();
    window.onload = fetchSunData;
</script>

</body>
</html>
