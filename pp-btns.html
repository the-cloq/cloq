  <script>
    function initPayPalButton() {
      paypal.Buttons({
        style: {
          shape: 'pill',
          color: 'blue',
          layout: 'vertical',
          label: 'checkout',
          
        },

        createOrder: function(data, actions) {
          return actions.order.create({
            purchase_units: [{"description":"CLOQ, Classic Noir - English","amount":{"currency_code":"GBP","value":2100,"breakdown":{"item_total":{"currency_code":"GBP","value":1750},"shipping":{"currency_code":"GBP","value":0},"tax_total":{"currency_code":"GBP","value":350}}}}]
          });
        },

        onApprove: function(data, actions) {
          return actions.order.capture().then(function(orderData) {
            
            // Full available details
            console.log('Capture result', orderData, JSON.stringify(orderData, null, 2));

            actions.redirect('https://thecloq.art/thankyou/');
            
          });
        },

        onError: function(err) {
          console.log(err);
        }
      }).render('#pp-btn-noir-en');
    }
    initPayPalButton();
  </script>
